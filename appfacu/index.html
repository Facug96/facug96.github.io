subtitle{font-size:14px;color:var(--muted);margin:4px 0 23px;overflow-wrap:anywhere}.sheet label{display:block;font-size:13px;font-weight:600;margin:17px 0 7px}.sheet input,.sheet select{display:block;width:100%;min-height:50px;border-radius:11px;border:1px solid #cdd6ca;background:white;color:var(--ink);padding:12px;font-size:16px}.sheet input:disabled{background:#eeeee7;color:var(--muted)}.sheet .field-hint{color:var(--muted);font-size:12px;line-height:1.5;margin:7px 0 0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{width:100%;margin-top:23px}.quick-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 23px}.quick-options button{min-height:62px;background:var(--soft);color:var(--green);font-size:16px}.form-error{color:var(--red);font-size:13px;line-height:1.4;margin:12px 0 0}.form-error:empty{display:none}.settings-section{padding:15px 0;border-top:1px solid var(--line)}.settings-section p{font-size:13px;color:var(--muted);margin:4px 0 12px}.settings-section h3{font-size:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body.dialog-open{overflow:hidden}.muted{color:var(--muted)}@media(min-width:600px){.shell{padding-left:36px;padding-right:36px}.topbar{padding-top:32px}.checkout{padding-left:36px;padding-right:36px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cards .card{margin:0}.card-actions{margin-top:20px}dialog{margin:auto;border-radius:22px}.sheet{padding:20px 27px 27px}.sheet-grip{display:none}.subtitle{max-width:none}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .1s}.toast{animation:appear .15s ease-out}@keyframes appear{from{opacity:0}to{opacity:1}}}@media(max-width:350px){.shell{padding-left:14px;padding-right:14px}.checkout{padding-left:14px;padding-right:14px}.checkout button{padding:12px 10px}.checkout strong{font-size:25px}}

<script id="core">
'use strict';
const AppCore = (() => {
 const DAY=86400000;
 function validDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return false;const d=new Date(value+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value;}
 function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
 function addDays(date,days){if(!validDate(date)||!Number.isFinite(days))throw Error('Fecha o frecuencia no válida.');return new Date(Date.parse(date+'T00:00:00Z')+Math.round(days)*DAY).toISOString().slice(0,10);}
 function average(dates,fallback){const sorted=[...new Set(dates.filter(validDate))].sort();if(sorted.length<2)return fallback;let sum=0;for(let i=1;i<sorted.length;i++)sum+=(Date.parse(sorted[i])-Date.parse(sorted[i-1]))/DAY;return sum/(sorted.length-1);}
 const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
 const moneyNumber=value=>{const n=Number(value);if(value===''||value==null||!Number.isFinite(n)||n<0||n>100000000)throw Error('Ingresá un precio entre 0 y 100.000.000.');return Math.round(n*100)/100;};
 function validate(fields,now=today()){
  const name=String(fields.name||'').trim();if(!name||name.length>80)throw Error('El nombre debe tener entre 1 y 80 caracteres.');
  const initialDurationDays=Number(fields.initialDurationDays);if(!Number.isInteger(initialDurationDays)||initialDurationDays<1||initialDurationDays>3650)throw Error('La frecuencia debe ser de 1 a 3650 días.');
  const initialLastPurchaseDate=fields.initialLastPurchaseDate||'';if(initialLastPurchaseDate&&(!validDate(initialLastPurchaseDate)||initialLastPurchaseDate>now))throw Error('La última compra debe ser una fecha válida, no futura.');
  return {name,category:String(fields.category||'Otros').slice(0,60),lastPrice:moneyNumber(fields.lastPrice),initialDurationDays,initialLastPurchaseDate};
 }
 function refresh(product,now=today()){return {...product,needed:!!product.manualNeeded||!product.nextEstimatedPurchaseDate||product.nextEstimatedPurchaseDate<=now};}
 function recalculate(product,now=today()){
  const p={...product};const history=[...p.purchaseHistory].sort((a,b)=>a.date.localeCompare(b.date));
  const dates=[p.initialLastPurchaseDate,...history.map(h=>h.date)].filter(Boolean);
  p.averageDurationDays=average(dates,p.initialDurationDays);p.lastPurchaseDate=dates.sort().at(-1)||'';
  if(history.length)p.lastPrice=history.at(-1).price;
  p.nextEstimatedPurchaseDate=p.lastPurchaseDate?addDays(p.lastPurchaseDate,p.averageDurationDays):'';
  return refresh(p,now);
 }
 function create(fields,now=today()){const clean=validate(fields,now);return recalculate({...clean,id:uid(),needed:false,manualNeeded:false,purchaseHistory:[],snoozedUntil:'',isDemo:false},now);}
 function purchase(product,input,now=today()){
  if(!validDate(input.date)||input.date>now)throw Error('Elegí una fecha de compra válida, hasta hoy.');
  const price=moneyNumber(input.price);
  const entry={id:uid(),name:product.name,category:product.category,date:input.date,price};
  return recalculate({...product,purchaseHistory:[...product.purchaseHistory,entry],manualNeeded:false,snoozedUntil:''},now);
 }
 function postpone(product,date,now=today()){if(!validDate(date)||date<=now)throw Error('Elegí una fecha posterior a hoy.');return {...product,nextEstimatedPurchaseDate:date,snoozedUntil:date,manualNeeded:false,needed:false};}
 function force(product){return {...product,manualNeeded:true,needed:true};}
 function edit(product,fields,now=today()){
  const clean=validate(fields,now);let p={...product,...clean};
  // Editing a label or price never cancels a manual postponement.
  if(clean.initialDurationDays!==product.initialDurationDays||clean.initialLastPurchaseDate!==product.initialLastPurchaseDate){
   p=recalculate(p,now);p.lastPrice=clean.lastPrice;
   if(product.snoozedUntil)p.nextEstimatedPurchaseDate=product.snoozedUntil;
  }
  return refresh(p,now);
 }
 return {validDate,today,addDays,average,uid,moneyNumber,validate,refresh,recalculate,create,purchase,postpone,force,edit};
})();
</script>
<script id="app">
'use strict';
/* A mano: storage, rendering and events. All dates are local calendar dates;
   UTC is used only for day arithmetic, so DST cannot shift a purchase date. */
const SuperApp = (() => {
 const KEY='a-mano.supermarket.v1', C=AppCore;
 const categories=['Almacén','Frutas y verduras','Limpieza','Higiene','Bebidas','Refrigerados','Otros'];
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pesos=v=>'$ '+new Intl.NumberFormat('es-UY',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2}).format(v);
 const sum=entries=>entries.reduce((n,h)=>n+Math.round(h.price*100),0)/100;
 const fmtDate=(s,long=false)=>s?new Date(s+'T12:00:00').toLocaleDateString('es-UY',long?{day:'numeric',month:'long',year:'numeric'}:{day:'2-digit',month:'2-digit',year:'numeric'}):'Sin registrar';
 const icon=name=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">${({bag:'<path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',products:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--bg)"/><circle cx="15" cy="17" r="3" fill="var(--bg)"/>'})[name]||''}</svg>`;
 let state,screen='shopping',query='',toastTimer,storageProblem='',blocked=false,lastSaved=null,lastDay=C.today(),returnFocus=null;
 function blank(){return {version:1,products:[],archivedPurchases:[],demoRemoved:true};}
 function demo(){return {version:1,demoRemoved:false,archivedPurchases:[],products:[['Papel higiénico','Higiene',320,30],['Servilletas','Almacén',180,25],['Limones','Frutas y verduras',220,7],['Aceite','Almacén',530,40],['Café','Almacén',420,25]].map(([name,category,lastPrice,initialDurationDays])=>({...C.create({name,category,lastPrice,initialDurationDays}),isDemo:true}))};}
 function validState(s){return s&&s.version===1&&Array.isArray(s.products)&&Array.isArray(s.archivedPurchases)&&s.products.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(p.lastPrice)&&p.lastPrice>=0&&Number.isFinite(p.initialDurationDays)&&p.initialDurationDays>=1&&Array.isArray(p.purchaseHistory)&&p.purchaseHistory.every(validEntry)&&(!p.nextEstimatedPurchaseDate||C.validDate(p.nextEstimatedPurchaseDate)))&&s.archivedPurchases.every(validEntry);}
 function validEntry(e){return e&&C.validDate(e.date)&&Number.isFinite(e.price)&&e.price>=0&&typeof e.name==='string';}
 function load(){
  try{lastSaved=localStorage.getItem(KEY);if(lastSaved===null){state=demo();persist();}else{const parsed=JSON.parse(lastSaved);if(!validState(parsed))throw Error('Invalid data');state=parsed;}}
  catch(e){if(lastSaved!==null){state=blank();blocked=true;storageProblem='No pudimos leer los datos guardados. No los sobrescribimos. Descargá una copia desde Configuración antes de reiniciar.';}else{state=demo();storageProblem='El navegador no permite guardar datos. Podés probar la app, pero los cambios se perderán al cerrarla. Usá un navegador con almacenamiento habilitado.';}}
 }
 function persist(){
  if(blocked)return false;
  try{const raw=JSON.stringify(state);localStorage.setItem(KEY,raw);lastSaved=raw;storageProblem='';return true;}
  catch(e){storageProblem='No se pudieron guardar los cambios en este dispositivo. No cierres la página: descargá una copia desde Configuración.';return false;}
 }
 function refresh(){state.products=state.products.map(p=>C.refresh(p));}
 function change(fn){
  if(blocked){toast('Primero recuperá o reiniciá los datos desde Configuración.');return false;}
  // Avoid silently overwriting a newer edit made in another tab.
  try{const current=localStorage.getItem(KEY);if(current!==lastSaved){const external=current===null?blank():JSON.parse(current);if(!validState(external))throw Error('Invalid external data');state=external;lastSaved=current;refresh();render();toast('La lista cambió en otra pestaña. Revisala y repetí la acción.');return false;}}catch(e){}
  fn();refresh();persist();render();return true;
 }
 function allHistory(){return [...state.archivedPurchases,...state.products.flatMap(p=>p.purchaseHistory)].sort((a,b)=>b.date.localeCompare(a.date));}
 function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',4400);}
 function warning(){ $('storage-warning').innerHTML=storageProblem?`<div class="notice error-banner">${esc(storageProblem)} <button data-action="settings">Configuración</button></div>`:''; }
 function empty(title,message,button=''){return `<div class="empty">${icon('check')}<h2>${esc(title)}</h2><p>${esc(message)}</p>${button}</div>`;}
 function demoNote(){return state.products.some(p=>p.isDemo)?'<div class="notice"><strong>Una lista de ejemplo, para empezar.</strong>Estos productos son demo; no hay compras ficticias. <button data-action="remove-demo">Quitar ejemplos</button></div>':'';}
 function monthly(){const h=allHistory().filter(h=>h.date.slice(0,7)===C.today().slice(0,7));return `<div class="month-strip"><span>Este mes</span><span><strong>${h.length}</strong> compras registradas</span><span><strong>${pesos(sum(h))}</strong> gastados</span></div>`;}
 function reason(p){if(p.manualNeeded)return 'Agregado por vos';if(p.snoozedUntil)return 'Llegó la fecha que elegiste';if(!p.lastPurchaseDate)return 'Primera compra';return 'Reposición estimada';}
 function shopping(){
  const pending=state.products.filter(p=>p.needed);
  return `<div class="eyebrow">LO COTIDIANO, RESUELTO</div><div class="page-heading"><h1>Comprar</h1><span class="count" aria-label="${pending.length} productos pendientes">${pending.length}</span></div><p class="subtitle">Lo que probablemente te esté faltando.<br>Vos tenés la última palabra.</p>${monthly()}${demoNote()}${pending.length?`<div class="section-label"><span>Tu próxima compra</span><span>Último precio conocido · UYU</span></div><div class="cards">${pending.map(p=>`<article class="card" data-shopping-card="${esc(p.id)}"><div class="card-top"><div class="card-name"><h3>${esc(p.name)}</h3><p class="category">${esc(p.category)}</p></div><span class="price">${pesos(p.lastPrice)}</span></div><span class="tag ${p.manualNeeded?'manual':''}">${reason(p)}</span><div class="card-actions"><button class="secondary" data-action="postpone" data-id="${esc(p.id)}">${icon('clock')}Todavía tengo</button><button class="primary" data-action="buy" data-id="${esc(p.id)}">${icon('check')}Comprado</button></div></article>`).join('')}</div>`:empty('Por ahora, todo a mano.',state.products.length?'Tus productos volverán cuando se acerque su reposición. También podés añadirlos manualmente desde Productos.':'Empezá por esos productos que comprás una y otra vez.','<button class="primary" data-action="add">Agregar un producto</button>')}`;
 }
 function productCards(){
  const list=state.products.filter(p=>(p.name+' '+p.category).toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es'))).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  return list.length?list.map(p=>`<article class="card product-card" data-product-card="${esc(p.id)}"><div class="card-top"><div class="card-name"><h3>${esc(p.name)}</h3><p class="category">${esc(p.category)}${p.isDemo?' · Demo':''}</p></div><span class="price">${pesos(p.lastPrice)}</span></div><dl class="detail-grid"><div><dt>Última compra</dt><dd>${fmtDate(p.lastPurchaseDate)}</dd></div><div><dt>Frecuencia estimada</dt><dd>Cada ${new Intl.NumberFormat('es-UY',{maximumFractionDigits:1}).format(p.averageDurationDays)} días</dd></div><div><dt>Próxima compra estimada</dt><dd>${p.nextEstimatedPurchaseDate?fmtDate(p.nextEstimatedPurchaseDate):'Cuando lo necesites'}</dd></div><div><dt>Estimación basada en</dt><dd>${[...new Set([p.initialLastPurchaseDate,...p.purchaseHistory.map(h=>h.date)].filter(Boolean))].length>1?'Tu historial':'Frecuencia inicial'}</dd></div></dl><div class="product-status">${p.needed?'En tu lista de compras':p.snoozedUntil?'Pospuesto por vos':'Todavía no hace falta'}</div><div class="card-actions"><button class="secondary" data-action="force" data-id="${esc(p.id)}" ${p.needed?'disabled':''}>${p.needed?'En la lista':'Lo necesito'}</button><button class="primary" data-action="buy" data-id="${esc(p.id)}">Comprado</button><button class="plain edit-button" data-action="edit" data-id="${esc(p.id)}">Editar</button></div></article>`).join(''):empty(query?'Sin coincidencias':'Tus habituales, acá.',query?'Probá con otro nombre o categoría.':'Guardá un producto y elegí cada cuánto solés comprarlo.');
 }
 function products(){return `<div class="eyebrow">TU BASE PERSONAL</div><div class="page-heading"><h1>Mis productos</h1><button class="primary icon-btn" data-action="add" aria-label="Agregar producto">＋</button></div><p class="subtitle">${state.products.length} productos guardados. Tu lista aprende tus tiempos, no al revés.</p><div class="product-tools"><label class="sr-only" for="search">Buscar productos</label><input class="search" id="search" type="search" placeholder="Buscar nombre o categoría" value="${esc(query)}" autocomplete="off"></div><div id="product-results">${productCards()}</div><button class="text-button" data-action="settings">Datos, ejemplos y configuración</button>`;}
 function history(){const all=allHistory(),groups=new Map();all.forEach(h=>{if(!groups.has(h.date))groups.set(h.date,[]);groups.get(h.date).push(h)});return `<div class="eyebrow">LO QUE YA COMPRASTE</div><div class="page-heading"><h1>Historial</h1>${all.length?'<button class="plain icon-btn" data-action="backup" aria-label="Descargar copia de mis datos">↓</button>':''}</div><p class="subtitle">Tus compras, con sus precios reales.<br>Todo queda en este dispositivo.</p>${monthly()}${all.length?[...groups].map(([date,entries])=>`<section class="history-group"><div class="history-heading"><strong>${fmtDate(date,true)}</strong><span>Total: <strong>${pesos(sum(entries))}</strong></span></div><div class="history-list">${entries.map(h=>`<div class="history-row"><div><strong>${esc(h.name)}</strong><small>${esc(h.category||'Otros')}${h.archived?' · Producto eliminado':''}</small></div><span class="price">${pesos(h.price)}</span></div>`).join('')}</div></section>`).join(''):empty('Todavía no hay compras.','Cuando marques un producto como comprado, aparecerá acá con su fecha y precio.')}`;}
 function render(){
  refresh();warning();$('content').innerHTML=screen==='shopping'?shopping():screen==='products'?products():history();
  const pending=state.products.filter(p=>p.needed);$('total-price').textContent=pesos(sum(pending.map(p=>({price:p.lastPrice}))));$('total-note').textContent=`${pending.length} productos pendientes · precios orientativos`;
  $('checkout').hidden=screen!=='shopping';document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===screen);if(b.dataset.page===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  document.title=({shopping:'Comprar',products:'Mis productos',history:'Historial'})[screen]+' · A mano';
 }
 function open(title,body){returnFocus=document.activeElement;$('modal-title').textContent=title;$('modal-body').innerHTML=body;if(!$('modal').open)$('modal').showModal();document.body.classList.add('dialog-open');$('modal').scrollTop=0;}
 function close(){ $('modal').close(); }
 const errorSlot='<p id="form-error" class="form-error" role="alert"></p>';
 function formHandler(callback){$('action-form').addEventListener('submit',e=>{e.preventDefault();try{callback(new FormData(e.currentTarget));}catch(err){$('form-error').textContent=err.message;}});}
 function productForm(id){
  const p=state.products.find(x=>x.id===id);if(id&&!p)return;const hasHistory=!!p?.purchaseHistory.length;
  open(p?'Editar producto':'Agregar producto',`<p class="sheet-subtitle">${p?'Ajustá lo que cambió. Tu historial se conserva.':'Lo guardamos para tus próximas compras.'}</p><form id="action-form"><label for="product-name">Nombre</label><input id="product-name" name="name" required maxlength="80" placeholder="Ej. Leche" value="${esc(p?.name||'')}" autocomplete="off"><label for="product-category">Categoría</label><select id="product-category" name="category">${categories.map(c=>`<option ${c===(p?.category||'Almacén')?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="form-row"><div><label for="product-price">Precio aproximado · UYU</label><input id="product-price" name="price" type="number" min="0" max="100000000" step="0.01" inputmode="decimal" required value="${p?.lastPrice??''}" placeholder="0"></div><div><label for="product-frequency">Frecuencia inicial · días</label><input id="product-frequency" name="frequency" type="number" min="1" max="3650" step="1" inputmode="numeric" required value="${p?.initialDurationDays||30}"></div></div><p class="field-hint">Con dos fechas de compra distintas, usamos el promedio de días entre ellas.</p><label for="product-date">${hasHistory?'Última compra registrada':'Última compra (opcional)'}</label><input id="product-date" name="date" type="date" max="${C.today()}" value="${hasHistory?p.lastPurchaseDate:p?.initialLastPurchaseDate||''}" ${hasHistory?'disabled':''}><p class="field-hint">${hasHistory?'Esta fecha viene del historial. Registrá otra compra para actualizarla.':'Sirve como punto de partida. No agrega gasto al historial. Sin fecha, el producto se añade a Comprar.'}</p>${errorSlot}<button class="primary wide" type="submit">Guardar producto</button>${p?`<button type="button" class="danger wide" data-action="delete" data-id="${esc(p.id)}">Eliminar producto</button>`:''}</form>`);
  formHandler(f=>{const fields={name:f.get('name'),category:f.get('category'),lastPrice:f.get('price'),initialDurationDays:f.get('frequency'),initialLastPurchaseDate:hasHistory?p.initialLastPurchaseDate:f.get('date')};const product=p?C.edit(p,fields):C.create(fields);if(change(()=>{if(p)state.products=state.products.map(x=>x.id===p.id?product:x);else state.products.push(product)})){close();toast(p?'Producto actualizado.':'Producto guardado.')}});
 }
 function buy(id){const p=state.products.find(x=>x.id===id);if(!p)return;open('Registrar compra',`<p class="sheet-subtitle">${esc(p.name)}</p><form id="action-form"><label for="purchase-price">Precio pagado · UYU</label><input id="purchase-price" name="price" type="number" inputmode="decimal" min="0" max="100000000" step="0.01" value="${p.lastPrice}" required><label for="purchase-date">Fecha de compra</label><input id="purchase-date" name="date" type="date" max="${C.today()}" value="${C.today()}" required><p class="field-hint">Actualizamos el precio, guardamos la compra y estimamos la próxima reposición.</p>${errorSlot}<button class="primary wide" type="submit">Guardar compra</button></form>`);formHandler(f=>{const next=C.purchase(p,{date:f.get('date'),price:f.get('price')});if(change(()=>state.products=state.products.map(x=>x.id===id?next:x))){close();toast(next.needed?'Compra guardada. Por su fecha, ya corresponde reponer.':'Compra guardada. Te lo recordamos más adelante.')}});}
 function postpone(id){const p=state.products.find(x=>x.id===id);if(!p)return;open('Todavía tengo',`<p class="sheet-subtitle">${esc(p.name)} · ¿Cuándo volvemos a sugerirlo?</p><div class="quick-options">${[3,7,14].map(n=>`<button data-action="delay" data-id="${esc(id)}" data-days="${n}">+${n} días</button>`).join('')}</div><form id="action-form"><label for="postpone-date">O elegí una fecha</label><input id="postpone-date" name="date" type="date" min="${C.addDays(C.today(),1)}" value="${C.addDays(C.today(),7)}" required><p class="field-hint">Se cuenta desde hoy. No cambia tu frecuencia habitual ni registra una compra.</p>${errorSlot}<button class="primary wide" type="submit">Posponer hasta esa fecha</button></form>`);formHandler(f=>applyDelay(id,f.get('date')));}
 function applyDelay(id,date){const p=state.products.find(x=>x.id===id);if(!p)return;const next=C.postpone(p,date);if(change(()=>state.products=state.products.map(x=>x.id===id?next:x))){close();toast('Pospuesto hasta el '+fmtDate(date)+'.')}}
 function confirmDelete(id){const p=state.products.find(x=>x.id===id);if(!p)return;open('¿Eliminar producto?',`<p class="sheet-subtitle">${esc(p.name)} se quitará de tus productos y de Comprar. Sus compras anteriores seguirán en Historial.</p><button class="danger wide" data-action="confirm-delete" data-id="${esc(id)}">Sí, eliminar</button><button class="plain wide" data-action="cancel">Cancelar</button>`);}
 function settings(){open('Tus datos',`<p class="sheet-subtitle">Sin cuenta. Sin servidores. Tu lista es tuya.</p><div class="settings-section"><h3>Guardado en este navegador</h3><p>Precios en pesos uruguayos (UYU). No hay sincronización entre dispositivos. Borrar los datos del navegador también borra la lista. En modo privado, el guardado puede ser temporal.</p><p>Las sugerencias se revisan al abrir la app y mientras está visible; no enviamos notificaciones.</p><button class="plain" data-action="backup">Descargar copia de mis datos</button></div><div class="settings-section"><h3>Productos de ejemplo</h3><p>Quitá los cinco productos demo para empezar con tu propia lista. Las compras reales que hayas registrado se conservan en Historial.</p><button class="plain" data-action="remove-demo" ${state.products.some(p=>p.isDemo)?'':'disabled'}>Borrar datos demo</button></div><div class="settings-section"><h3>Empezar de cero</h3><p>Elimina todos los productos y todo el historial de este navegador. Los ejemplos no vuelven a cargarse.</p><button class="danger" data-action="reset">Borrar todos mis datos</button></div>`);}
 function download(){const text=blocked?lastSaved:JSON.stringify(state,null,2);const url=URL.createObjectURL(new Blob([text||''],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='a-mano-'+C.today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia descargada. Guardala en un lugar seguro.');}
 function action(type,id,el){
  if(type==='add')productForm();if(type==='edit')productForm(id);if(type==='buy')buy(id);if(type==='postpone')postpone(id);if(type==='settings')settings();if(type==='backup')download();if(type==='cancel')close();
  if(type==='force'&&change(()=>state.products=state.products.map(p=>p.id===id?C.force(p):p)))toast('Agregado a Comprar.');
  if(type==='delay')applyDelay(id,C.addDays(C.today(),Number(el.dataset.days)));
  if(type==='delete')confirmDelete(id);
  if(type==='confirm-delete'&&change(()=>{const p=state.products.find(x=>x.id===id);if(p){state.archivedPurchases.push(...p.purchaseHistory.map(h=>({...h,archived:true})));state.products=state.products.filter(x=>x.id!==id)}})){close();toast('Producto eliminado. Historial conservado.');}
  if(type==='remove-demo')open('¿Quitar los ejemplos?',`<p class="sheet-subtitle">Se eliminarán los productos marcados como Demo. Tus productos propios y las compras registradas se conservan.</p><button class="primary wide" data-action="confirm-demo">Quitar ejemplos</button><button class="plain wide" data-action="cancel">Cancelar</button>`);
  if(type==='confirm-demo'&&change(()=>{state.products.filter(p=>p.isDemo).forEach(p=>state.archivedPurchases.push(...p.purchaseHistory.map(h=>({...h,archived:true}))));state.products=state.products.filter(p=>!p.isDemo);state.demoRemoved=true})){close();toast('Ejemplos eliminados. Ya es tu lista.');}
  if(type==='reset')open('¿Borrar todos tus datos?',`<p class="sheet-subtitle">Esta acción no se puede deshacer. Se eliminarán tus productos y tus compras guardadas. Descargá una copia antes si querés conservarlos.</p><button class="danger wide" data-action="confirm-reset">Sí, borrar todo</button><button class="plain wide" data-action="cancel">Cancelar</button>`);
  if(type==='confirm-reset'){blocked=false;state=blank();persist();query='';render();close();toast('Lista vacía. Podés empezar de nuevo.');}
 }
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){screen=b.dataset.page;render();window.scrollTo(0,0);}if(b.dataset.action){try{action(b.dataset.action,b.dataset.id,b)}catch(err){if($('form-error'))$('form-error').textContent=err.message;else toast(err.message)}}});
 document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('product-results').innerHTML=productCards()}});
 $('settings-button').onclick=settings;$('close-modal').onclick=close;
 $('modal').addEventListener('close',()=>{document.body.classList.remove('dialog-open');if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('.bottom-nav .active')?.focus()});
 $('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
 function checkDay(){if(document.visibilityState==='hidden')return;if(C.today()!==lastDay){lastDay=C.today();refresh();persist();render();}}
 document.addEventListener('visibilitychange',checkDay);window.addEventListener('focus',checkDay);setInterval(checkDay,30000);
 window.addEventListener('storage',e=>{if(e.key===KEY&&!$('modal').open){try{const next=e.newValue?JSON.parse(e.newValue):blank();if(validState(next)){state=next;lastSaved=e.newValue;render()}}catch(err){}}});
 $('brand-icon').innerHTML=icon('bag');$('settings-button').innerHTML=icon('settings');$('nav-shopping-icon').innerHTML=icon('bag');$('nav-products-icon').innerHTML=icon('products');$('nav-history-icon').innerHTML=icon('history');
 load();refresh();if(!blocked)persist();render();
 return {storageKey:KEY};
})();
</script></body></html>
